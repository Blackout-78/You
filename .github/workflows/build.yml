name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '*.md'
      - 'LICENSE'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: 8.9
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          # Remove spaces, line breaks and a pasted label, which copying on Windows can add.
          printf '%s' "$KEYSTORE_BASE64" | sed 's/KEYSTORE_BASE64//g' | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check the signing key and password
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          PW=$(printf '%s' "$STORE_PASSWORD" | tr -d ' \r\n\t')
          AL=$(printf '%s' "$STORE_ALIAS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$PW" -alias "$AL" > /dev/null 2>&1; then
            echo "::error::The key, KEYSTORE_PASSWORD or KEY_ALIAS secret doesn't match. Paste all three again from the .txt files."
            exit 1
          fi
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$AL" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk You.apk
      - name: Check the APK has no internet permission
        run: |
          APKANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -1)
          if [ -n "$APKANALYZER" ]; then
            "$APKANALYZER" manifest permissions You.apk | tee perms.txt
            if grep -qi "INTERNET" perms.txt; then echo "The app must not have the INTERNET permission"; exit 1; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: You-apk
          path: You.apk
      - name: Publish the APK as a release (easy one-click download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEYLINE="Signed with the permanent key. It installs over the previous version and keeps your data."
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshots
          cat > notes.md <<EOF
          ## You for Android ${{ github.run_number }}

          Your music, movies and TV shows on your phone. Offline and private: no internet permission, no ads, no tracking, nothing collected.

          **Status:** tested on a real phone, and the build passes its checks. $KEYLINE

          **What it does**
          - **Movies and TV Shows:** found automatically by file name, with posters, resume, subtitles and favorites.
          - **Music:** artists, albums, songs, playlists, favorites, lyrics and cover art.
          - **Make it yours:** your own picture and name, any color for the light, middle and dark tones, a background picture, and a home-screen icon color.
          - **Browse or Grid:** choose the layout for each tab.

          <img src="$RAW/01-movies.png" width="150"> <img src="$RAW/03-artist.png" width="150"> <img src="$RAW/05-colors.png" width="150"> <img src="$RAW/08-picture-background.png" width="150">

          *Design previews. All screens and install steps are on the [front page](https://github.com/${{ github.repository }}#readme).*
          EOF
          sed -i 's/^          //' notes.md
          gh release create "android-${{ github.run_number }}" You.apk \
            --title "You for Android ${{ github.run_number }}" \
            --notes-file notes.md
