name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '*.md'
      - 'LICENSE'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unlock the release key (only if the KEY_PASSPHRASE secret exists)
        env:
          KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
        run: |
          if [ -n "$KEY_PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEY_PASSPHRASE
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEY_PASSPHRASE" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "No KEY_PASSPHRASE secret: building with a test key."
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        run: |
          if [ "$SIGNED" = "release" ]; then
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk You.apk
          else
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk You.apk
          fi
      - name: Check the APK has no internet permission
        run: |
          APKANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -1)
          if [ -n "$APKANALYZER" ]; then
            "$APKANALYZER" manifest permissions You.apk | tee perms.txt
            if grep -qi "INTERNET" perms.txt; then echo "The app must not have the INTERNET permission"; exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: You-apk
          path: You.apk
      - name: Publish the APK as a release (easy one-click download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = "release" ]; then
            KEYLINE="Signed with the permanent key. It installs over the previous version and keeps your data."
          else
            KEYLINE="Signed with a test key. Uninstall the old version before installing this one."
          fi
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshots
          cat > notes.md <<EOF
          ## You for Android ${{ github.run_number }}

          Your music, movies and TV shows on your phone. Offline and private: no internet permission, no ads, no tracking, nothing collected.

          **Status:** builds and passes its checks. Not yet tested on a real phone. $KEYLINE

          **What it does**
          - **Movies and TV Shows:** found automatically by file name, with posters, resume, subtitles and favorites.
          - **Music:** artists, albums, songs, playlists, favorites, lyrics and cover art.
          - **Make it yours:** your own picture and name, any color for the light, middle and dark tones, a background picture, and a home-screen icon color.
          - **Browse or Grid:** choose the layout for each tab.

          <img src="$RAW/01-movies.png" width="150"> <img src="$RAW/03-artist.png" width="150"> <img src="$RAW/05-colors.png" width="150"> <img src="$RAW/08-picture-background.png" width="150">

          *Design previews. All screens and install steps are on the [front page](https://github.com/${{ github.repository }}#readme).*
          EOF
          sed -i 's/^          //' notes.md
          gh release create "android-${{ github.run_number }}" You.apk \
            --title "You for Android ${{ github.run_number }}" \
            --notes-file notes.md
